name: Autonomous AI Course Generator
# The console matches runs to jobs by display_title, so it carries the job id and phase.
run-name: "${{ inputs.job_id || github.run_id }} (${{ inputs.phase || 'n/a' }})"

on:
  schedule:
    - cron: '0 7 * * *' # 12:30 PM IST daily
  workflow_dispatch:
    inputs:
      phase:
        description: 'draft creates candidate only; publish uploads the saved candidate'
        required: true
        default: 'draft'
        type: choice
        options: [draft, publish, full]
      topic:
        description: 'Optional lesson topic'
        required: false
        default: ''
      language:
        description: 'Voice/caption language sent by the DYPOL console (Engine A narrates in English; accepted for payload compatibility)'
        required: false
        default: 'en'
      privacy:
        description: 'YouTube visibility; keep private for initial testing'
        required: true
        default: 'private'
        type: choice
        options: [private, unlisted, public]
      job_id:
        description: 'Stable DYPOL job ID used to connect draft and publish'
        required: false
        default: ''
      draft_run_id:
        description: 'GitHub Actions run ID that produced the approved draft; required for publish'
        required: false
        default: ''
      review_required:
        description: 'Keep 1 to require review and block full-phase upload'
        required: true
        default: '1'
      auto_publish:
        description: 'Set 1 only if automatic publishing is intentionally enabled'
        required: true
        default: '0'
      title_override:
        description: 'Optional reviewed title for the long-form video'
        required: false
        default: ''
      description_override:
        description: 'Optional reviewed description for the long-form video'
        required: false
        default: ''
      reviewer_feedback:
        description: 'Reviewer notes from a rejected attempt (redo); max 1500 chars are used'
        required: false
        default: ''
        type: string

# A run takes far longer than the gap between a manual dispatch and the daily
# schedule, so serialise them — two runs pushing to main race each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Speed: restore the fully installed virtualenv; pip install is skipped on a hit.
      - name: ♻️ Cache Python virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/.venv-dypol
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-v1

      - name: 🧪 Compile-check code and verify safe phase defaults
        run: |
          set -euo pipefail
          python -m compileall -q dypol_control.py main.py src
          python - <<'PY'
          from dypol_control import (
              resolve_policy, build_insert_body, verify_insert_body, PolicyViolation
          )
          draft = resolve_policy({"DYPOL_PHASE": "draft"})
          assert draft.allow_generate and not draft.allow_upload, draft
          body = build_insert_body("Test", "Preflight only", ["test"], "private")
          verify_insert_body(body, "private")
          try:
              verify_insert_body(body, "public")
          except PolicyViolation:
              pass
          else:
              raise AssertionError("Wrong visibility was not rejected")
          print("DYPOL policy preflight passed; no API call made.")
          PY

      - name: 📦 Install dependencies and patch ImageMagick
        env:
          VENV_CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # --no-install-recommends: ~126 -> far fewer packages (no pocketsphinx, docs, extra codecs).
          sudo apt-get install -y --no-install-recommends imagemagick ffmpeg
          POLICY_FILE=$( (find /etc -name "policy.xml" 2>/dev/null || true) | grep -i "ImageMagick" | head -n 1 || true)
          if [ -z "$POLICY_FILE" ]; then
            echo "❌ CRITICAL: Could not find ImageMagick's policy.xml file!"
            exit 1
          fi
          echo "✅ Found policy file at: $POLICY_FILE, applying patches..."
          sudo sed -i 's/<policy domain="resource" name="width" value=".*"\/>/<policy domain="resource" name="width" value="16384"\/>/' "$POLICY_FILE"
          sudo sed -i 's/<policy domain="resource" name="height" value=".*"\/>/<policy domain="resource" name="height" value="16384"\/>/' "$POLICY_FILE"

          echo "--- Installing Python packages ---"
          if [ "${VENV_CACHE_HIT:-}" != "true" ]; then
            python -m venv ~/.venv-dypol
            ~/.venv-dypol/bin/python -m pip install --upgrade pip
            ~/.venv-dypol/bin/pip install -r requirements.txt
          else
            echo "♻️ Restored cached virtualenv; pip install skipped."
          fi
          echo "$HOME/.venv-dypol/bin" >> "$GITHUB_PATH"
          echo "✅ Dependencies installed."

      - name: 🔑 Restore YouTube OAuth JSON only for an explicitly permitted upload phase
        if: ${{ inputs.phase == 'publish' || (inputs.phase == 'full' && inputs.auto_publish == '1' && inputs.review_required == '0') }}
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_CLIENT_SECRETS_JSON:-}" ] || [ -z "${YOUTUBE_CREDENTIALS_JSON:-}" ]; then
            echo "::error::YouTube OAuth JSON secrets are missing. Add YOUTUBE_CLIENT_SECRETS_JSON and YOUTUBE_CREDENTIALS_JSON in Settings > Secrets and variables > Actions. Upload was not attempted."
            exit 2
          fi
          printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > credentials.json
          python - <<'PY'
          import json
          from pathlib import Path

          client = json.loads(Path("client_secrets.json").read_text(encoding="utf-8"))
          if not any(key in client for key in ("installed", "web")):
              raise SystemExit("Client secret JSON is missing the installed/web OAuth configuration.")
          creds = json.loads(Path("credentials.json").read_text(encoding="utf-8"))
          required = ("client_id", "client_secret", "refresh_token", "token_uri")
          missing = [key for key in required if not creds.get(key)]
          if missing:
              raise SystemExit("OAuth credential JSON is missing required fields: " + ", ".join(missing))
          scopes = creds.get("scopes") or []
          if "https://www.googleapis.com/auth/youtube.upload" not in scopes:
              raise SystemExit("OAuth credential JSON does not include the youtube.upload scope.")
          if "https://www.googleapis.com/auth/youtube.force-ssl" not in scopes:
              # Not fatal: the uploader asks for force-ssl on refresh and falls back to
              # upload-only (captions skipped) if the refresh token does not hold it.
              print("::warning::credentials JSON scopes list lacks youtube.force-ssl; caption upload may be skipped.")
          print("YouTube OAuth JSON validated. Secret values were not printed.")
          PY
        shell: bash

      - name: Validate DYPOL job ID
        env:
          JOB_ID: ${{ inputs.job_id || github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::job_id may contain only letters, numbers, dot, underscore, and hyphen."
            exit 2
          fi


      - name: Validate publish handoff
        if: ${{ inputs.phase == 'publish' }}
        env:
          JOB_ID: ${{ inputs.job_id }}
          DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$JOB_ID" ] || [ -z "$DRAFT_RUN_ID" ]; then
            echo "::error::phase=publish requires both job_id and draft_run_id from the approved draft run."
            exit 2
          fi

      - name: Download approved candidate (publish phase only)
        if: ${{ inputs.phase == 'publish' }}
        uses: actions/download-artifact@v4
        with:
          name: dypol-candidate-${{ inputs.job_id }}
          run-id: ${{ inputs.draft_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: output


      - name: 🚀 Run DYPOL phase-aware production pipeline
        id: production-run
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DYPOL_GEMINI_IMAGE_ENABLED: ${{ vars.DYPOL_GEMINI_IMAGE_ENABLED || '0' }}
          DYPOL_GEMINI_IMAGE_MODEL: ${{ vars.DYPOL_GEMINI_IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          DYPOL_VISUAL_REVIEW_APPROVED: ${{ vars.DYPOL_VISUAL_REVIEW_APPROVED || '0' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite' }}
          DYPOL_PHASE: ${{ inputs.phase || 'draft' }}
          DYPOL_TOPIC: ${{ inputs.topic || '' }}
          DYPOL_JOB_ID: ${{ inputs.job_id || github.run_id }}
          DYPOL_REVIEW_REQUIRED: ${{ inputs.review_required || '1' }}
          DYPOL_AUTO_PUBLISH: ${{ inputs.auto_publish || '0' }}
          DYPOL_TITLE_OVERRIDE: ${{ inputs.title_override || '' }}
          DYPOL_DESCRIPTION_OVERRIDE: ${{ inputs.description_override || '' }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy || 'private' }}
          REVIEWER_FEEDBACK: ${{ inputs.reviewer_feedback || '' }}
          # Unbuffered output: per-stage timings in the log line up with real time.
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python main.py 2>&1 | tee "$RUNNER_TEMP/dypol-run.log"

      - name: 📦 Save draft candidate for later approved publishing
        if: ${{ success() && inputs.phase != 'publish' }}
        uses: actions/upload-artifact@v4
        with:
          name: dypol-candidate-${{ inputs.job_id || github.run_id }}
          path: output/
          # Drafts are ~100-120 MB; 3 days keeps the free 500 MB Actions storage from filling.
          retention-days: 3
          if-no-files-found: error

      # Fast console preview: a small 480p H.264 copy (+faststart, so the browser can start
      # playing before the whole file arrives). Stored uncompressed in its own artifact so
      # the console can stream the zip entry directly. Never fails the draft.
      - name: 🎬 Build small preview copies for the console
        id: preview
        if: ${{ success() && inputs.phase != 'publish' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p preview
          make_preview() {
            # $1 source, $2 dest, $3 scale filter, $4 max video bitrate
            ffmpeg -nostdin -y -hide_banner -loglevel error -i "$1" \
              -vf "$3,fps=30" -c:v libx264 -preset veryfast -profile:v main -pix_fmt yuv420p \
              -crf 30 -maxrate "$4" -bufsize "$4" -g 60 \
              -c:a aac -b:a 64k -ac 2 -ar 44100 -movflags +faststart "$2" \
              && echo "preview $(basename "$2"): $(du -h "$2" | cut -f1)" \
              || { echo "::warning::preview encode failed for $1"; rm -f "$2"; }
          }
          LONG=$(ls output/long_video_*.mp4 2>/dev/null | head -n 1 || true)
          SHORT=$(ls output/short_video_*.mp4 2>/dev/null | head -n 1 || true)
          [ -n "$LONG" ] && make_preview "$LONG" preview/preview_long.mp4 "scale=-2:480" 450k
          [ -n "$SHORT" ] && make_preview "$SHORT" preview/preview_short.mp4 "scale=-2:720" 700k
          ls -la preview || true

      - name: 📤 Upload console preview artifact
        if: ${{ success() && inputs.phase != 'publish' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.job_id || github.run_id }}
          path: preview/
          # Already-compressed mp4: store as-is (zip "stored") so the console can stream it.
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

      - name: 🗂️ Upload verified DYPOL run result backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dypol-result-${{ github.run_id }}
          path: output/upload_results.json
          retention-days: 14
          if-no-files-found: ignore

      - name: 🔎 Upload Audio Artifact for Debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audio-debug-files
          path: output/*.wav
          retention-days: 1
          if-no-files-found: ignore

      - name: 🎥 Upload Final Video for Debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-videos
          path: output/*.mp4
          retention-days: 1
          if-no-files-found: ignore

      - name: 🎞️ Generate demo GIF from latest video
        if: steps.production-run.outcome == 'success'
        run: |
          VIDEO=$(ls output/long_video_*.mp4 2>/dev/null | head -n 1 || true)
          if [ -n "$VIDEO" ]; then
            echo "✅ Found video: $VIDEO — converting to GIF..."
            ffmpeg -y -ss 0 -t 12 -i "$VIDEO" \
              -filter_complex "[0:v] fps=8,scale=320:-1:flags=lanczos,split [a][b];[a] palettegen [p];[b][p] paletteuse" \
              images/demo.gif
            echo "✅ Demo GIF created at images/demo.gif"
          else
            echo "⚠️ No long video found in output/, skipping GIF creation."
          fi

      - name: 💾 Commit plan and verified run result to the current branch
        if: steps.production-run.outcome == 'success'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p dypol-results
          if [ -f output/upload_results.json ]; then
            cp output/upload_results.json "dypol-results/$RUN_ID.json"
          fi
          git add content_plan.json
          if [ -f images/demo.gif ]; then git add images/demo.gif; fi
          if [ -f "dypol-results/$RUN_ID.json" ]; then git add "dypol-results/$RUN_ID.json"; fi
          if git diff --cached --quiet; then
            echo "No generated state changes to commit."
            exit 0
          fi
          git commit -m "dypol: save plan and verified result for run $RUN_ID"
          git fetch origin "$BRANCH_NAME"
          git rebase "origin/$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"

      # Failed publish: record why (failure_category + redacted log tail) and keep any
      # video that was already uploaded, so the console never re-uploads it.
      - name: 🧾 Record failed publish result for the console
        if: ${{ failure() && (inputs.phase == 'publish' || inputs.phase == 'full') }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ inputs.job_id || github.run_id }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          python3 scripts/report_failure.py \
            --job-id "$JOB_ID" --run-id "$RUN_ID" --phase "$PHASE" \
            --log "$RUNNER_TEMP/dypol-run.log" \
            --partial output/upload_results.json \
            --default-category publish \
            --out "dypol-results/$RUN_ID.json"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "dypol-results/$RUN_ID.json"
          git commit -m "dypol: failed publish result for run $RUN_ID" || exit 0
          git fetch origin "$BRANCH_NAME"
          git rebase --autostash "origin/$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
