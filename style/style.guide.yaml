# DYPOL style guide — Engine A (long 16:9 video). Loaded only through src/style.py.
# Source: references/style-guide-proposal.md sections (b), (c) and "DYPOL's own look" (draft v0.1, 1 Nov 2026).
version: 1

# Brand narration voice, shared with Engine B (bake-off 3 Nov 2026: Kokoro am_michael was the most
# intelligible male voice at 2x / 2.5x playback and pauses at every comma and full stop).
# Env overrides: DYPOL_TTS_PROVIDER, KOKORO_VOICE, KOKORO_SPEED, KOKORO_MODEL_FILE, KOKORO_MODEL_DIR.
voice:
  provider: kokoro                 # kokoro | gtts (gtts is only the emergency fallback)
  voice: am_michael                # Kokoro-82M American male (Apache-2.0, local CPU)
  speed: 1.2                       # starting speed (technical scripts run ~135 WPM at 1.08); tuned per run toward wpm_target
  lang: en-us
  model_file: kokoro-v1.0-timestamped.onnx  # same audio as kokoro-v1.0.onnx + phoneme durations (exact word timings)
  wpm_min: 150
  wpm_max: 165
  wpm_target: 157
  speed_min: 0.95
  speed_max: 1.4                   # 1.3 capped the 3 Nov Short at 143 WPM; am_michael stays clear past 1.3
  fallback: gtts

long:
  narration:
    wpm_target: 158
    wpm_min: 150
    wpm_max: 165
  hook:
    no_intro: true                 # no "hello and welcome", no logo/title card first
    first_word_by_s: 0.5
    stakes_by_s: 3.0
    number_by_s: 8.0
    max_first_sentence_words: 14
    first_block_kinds: [count_up, kinetic_text, code_panel, diagram]   # a proof block, never a still
  chapters:
    min_interval_s: 60
    max_interval_s: 120
    card_kind: chapter_card
  pacing:
    screen_change_min_s: 2.0
    screen_change_max_s: 4.0
    max_static_s: 6.0
    target_shot_s: 3.0             # cuts land on narration clause boundaries near this length
    chapter_card_s: [1.0, 1.5]     # chapter cards are short stingers
    max_block_span_s: 10.0         # code_panel / diagram may run on across cuts (they animate throughout)
  variety:
    max_same_kind_run: 2           # never 3 blocks of the same kind in a row
    min_demo_share: 0.40           # share of shots that are demo-style blocks
    max_still_share: 0.15
    demo_kinds: [code_panel, diagram, count_up, icon_flow]   # icon_flow: internal (not in the model's enum)
    max_text_run: 2                # at most 2 text-dominant blocks (kinetic_text, chapter_card) in a row
  ending:
    takeaway: true
    asks: 1                        # exactly one ask: a specific comment question
  text:
    max_on_screen_words: 25
    min_number_px: 120
    safe_margin: 0.06

blocks:
  kinds: [kinetic_text, count_up, code_panel, diagram, chapter_card, stock_or_ai_still]
  rendered: [kinetic_text, count_up, code_panel, diagram, chapter_card]   # CPU renderers
  default_fallback: stock_or_ai_still
  diagram:
    min_nodes: 2
    max_nodes: 5
  code_panel:
    chars_per_s: 32
    max_lines: 10

look:
  size: [1920, 1080]
  fps: 30
  palette:
    background: "#0F141C"         # deep slate
    panel: "#161D28"
    border: "#26303D"
    body: "#EEF2F6"               # off-white
    muted: "#8A97A8"
    lime: "#C8F560"               # the point / new / winner
    cyan: "#4CC9F0"               # the product / system
    amber: "#FFB547"              # caveat / the catch
  grid:
    spacing_px: 64
    opacity: 0.04                  # diagram blocks only
  panel_radius_px: 14
  label_bar_px: 6
  fonts:
    # Both SIL Open Font License 1.1; licences vendored next to the files.
    headline:
      family: Space Grotesk
      file: assets/fonts/dypol/SpaceGrotesk-VF.ttf
      license: assets/fonts/dypol/OFL-SpaceGrotesk.txt
    mono:
      family: JetBrains Mono
      file: assets/fonts/dypol/JetBrainsMono-VF.ttf
      license: assets/fonts/dypol/OFL-JetBrainsMono.txt
  motion:
    easing: ease_in_out_cubic
  captions:
    # Burned-in caption lines: plain white with outline; only numbers/years/percentages and at most
    # one key term per sentence turn lime. Long: above the lower-third bottom band; Short: ~75 % height
    # (inside the Shorts safe zone, clear of the bottom ~20 % UI).
    font_file: assets/fonts/dypol/SpaceGrotesk-Bold.ttf   # static 700 instance of the OFL variable font
    family: Space Grotesk
    long: {max_words: 6, max_chars: 40, size_px: 56, center_y: 0.78}
    short: {min_words: 2, max_words: 4, max_chars: 22, size_px: 100, center_y: 0.75}
  grade:
    # ffmpeg filters on the encoder (runs per render chunk). vignette dither=0: the grain
    # that follows already dithers, and vignette's own dither roughly doubled its cost.
    filters: "format=yuv420p,eq=contrast=1.06:saturation=1.04,vignette=angle=0.38:dither=0,noise=alls=2:allf=t"
  audio:
    sfx_under_voice_db: 20         # soft procedural chime / whoosh / swell, >= 18 dB under the narration (src/sfx.py)
    sfx_per_min: [4, 8]
    target_lufs: -14
